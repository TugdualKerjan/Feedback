[project]
name = "marc"
version = "0.1.0"
description = "Website feedback annotation tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "uvicorn>=0.46.0",
    "pydantic>=1.10.0",
]

[project.scripts]
marc = "uvicorn main:app"
